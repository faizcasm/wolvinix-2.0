<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070d" />
    <meta name="color-scheme" content="dark light" />

    <title>Wolvinix — The Social Network Built for Gamers</title>
    <meta
      name="description"
      content="Wolvinix is where gamers connect. Share clips, build clans, track game stats, chat in real time and climb the leaderboard."
    />
    <meta name="author" content="Faizan Hameed" />
    <link rel="canonical" href="https://wolvinix.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wolvinix" />
    <meta property="og:title" content="Wolvinix — The Social Network Built for Gamers" />
    <meta
      property="og:description"
      content="Share clips, build clans, track game stats, chat in real time and climb the leaderboard."
    />
    <meta property="og:url" content="https://wolvinix.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wolvinix — The Social Network Built for Gamers" />
    <meta
      name="twitter:description"
      content="Share clips, build clans, track game stats, chat in real time and climb the leaderboard."
    />

    <meta
      name="keywords"
      content="gaming, gamers, social network, clans, esports, game stats, streaming, wolvinix"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("wolvinix.theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = stored ? stored === "dark" : !prefersLight;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
